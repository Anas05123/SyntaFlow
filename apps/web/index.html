<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/brand/barlow-condensed-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/brand/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Your people. Your work, together. | Syntaflow</title>
    <meta
      name="description"
      content="Keep client relationships, project context and versioned reviews together in the Syntaflow desktop preview. Explore a sample project in your browser."
    />
    <meta name="robots" content="index, follow" />
    <!-- SEOHead adds the canonical URL for the current route. This HTML is a shared fallback. -->

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Syntaflow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your people. Your work, together. | Syntaflow" />
    <meta property="og:description" content="Keep client relationships, project context and versioned reviews together in the Syntaflow desktop preview. Explore a sample project in your browser." />
    <meta property="og:url" content="https://syntaflow.tech/" />
    <meta property="og:image" content="https://syntaflow.tech/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Your people. Your work, together. | Syntaflow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your people. Your work, together. | Syntaflow" />
    <meta name="twitter:description" content="Keep client relationships, project context and versioned reviews together in the Syntaflow desktop preview. Explore a sample project in your browser." />
    <meta name="twitter:image" content="https://syntaflow.tech/brand/og-image.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/brand/syntaflow-mark.png" />
    <link rel="apple-touch-icon" href="/brand/syntaflow-mark.png" />

    <link rel="preload" href="/brand/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured Data (Schema.org) for Pre-hydration Crawlers -->
    <script type="application/ld+json" id="sf-schema-website">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Syntaflow",
        "url": "https://syntaflow.tech/"
      }
    </script>
    <script type="application/ld+json" id="sf-schema-org">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Syntaflow",
        "url": "https://syntaflow.tech",
        "logo": "https://syntaflow.tech/brand/syntaflow-mark.png",
        "sameAs": ["https://github.com/Anas05123/SyntaFlow"]
      }
    </script>
    <script type="application/ld+json" id="sf-schema-app">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Syntaflow",
        "operatingSystem": "Windows 10, Windows 11",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "url": "https://syntaflow.tech",
        "downloadUrl": "https://syntaflow.tech/download"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Syntaflow’s website needs JavaScript. Enable it to open the site and interactive preview.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
